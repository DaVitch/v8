name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 * * * *"   # Runs every hour
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_CLONE_URL: ${{ vars.UPSTREAM_CLONE_URL || 'https://github.com/v8/v8' }}
      TARGET_BRANCH: main
      ALLOW_FORCE_WITH_LEASE: "true"  # Allow forced push if necessary

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetches all history
          ref: ${{ env.TARGET_BRANCH }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set Upstream remote
        run: |
          git remote add upstream "${UPSTREAM_CLONE_URL}" || git remote set-url upstream "${UPSTREAM_CLONE_URL}"

      - name: Fetch upstream changes
        run: |
          git fetch --tags upstream ${{ env.TARGET_BRANCH }}

      - name: Rebase or fast-forward
        id: merge
        run: |
          set -e
          # Try fast-forward first
          BEFORE=$(git rev-parse HEAD)

          if ! git merge --ff-only upstream/${{ env.TARGET_BRANCH }}; then
            echo "[info] ff-only failed, attempting rebase."
            git rebase upstream/${{ env.TARGET_BRANCH }}
          fi

          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> $GITHUB_OUTPUT
          echo "after=$AFTER" >> $GITHUB_OUTPUT
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Push changes to fork
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin ${{ env.TARGET_BRANCH }}

