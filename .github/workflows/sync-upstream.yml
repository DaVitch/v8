name: Sync Fork with Upstream

on:
  schedule:
    - cron: "0 */4 * * *"   # 4시간마다 실행
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    env:
      UPSTREAM_CLONE_URL: ${{ vars.UPSTREAM_CLONE_URL || 'https://github.com/v8/v8' }}
      TARGET_BRANCH: main
      ALLOW_FORCE_WITH_LEASE: "true"  # 강제 푸시 허용

    steps:
      - name: Checkout current repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 모든 커밋 기록을 가져옴 --
          ref: ${{ env.TARGET_BRANCH }}

      - name: Configure git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Set Upstream remote
        run: |
          git remote add upstream "${UPSTREAM_CLONE_URL}" || git remote set-url upstream "${UPSTREAM_CLONE_URL}"

      - name: Fetch upstream changes
        run: |
          git fetch --tags upstream ${{ env.TARGET_BRANCH }}

      - name: Rebase or fast-forward
        id: merge
        run: |
          set -e
          BEFORE=$(git rev-parse HEAD)

          # 패스트 포워드 시도
          if ! git merge --ff-only upstream/${{ env.TARGET_BRANCH }}; then
            echo "[info] ff-only 실패 → rebase onto upstream"
            git rebase upstream/${{ env.TARGET_BRANCH }}
          fi

          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> $GITHUB_OUTPUT
          echo "after=$AFTER" >> $GITHUB_OUTPUT
          if [ "$BEFORE" = "$AFTER" ]; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Resolve conflicts and continue rebase
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -e
          # 충돌 발생 시 자동으로 rebase --skip 실행
          git rebase --continue || git rebase --skip

      - name: Push changes to fork
        if: steps.merge.outputs.changed == 'true'
        run: |
          git push origin ${{ env.TARGET_BRANCH }} --force  # 강제 푸시
